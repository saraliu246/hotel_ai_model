<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>是否為回頭客</title>
<style>
    body {
        margin:0;
        font-family:'Arial',sans-serif;
        background:#0a0a1f;
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
        color:#0ff;
        overflow:hidden;
    }

    canvas {
        display:block;
    }

    h2 {
        position:absolute;
        top:20px;
        width:100%;
        text-align:center;
        font-size:32px;
        color:#0ff;
        text-shadow:0 0 15px #0ff;
    }
</style>
</head>
<body>
<h2>是否為回頭客</h2>
<canvas id="gauge" width="500" height="300"></canvas>

<script>
const canvas = document.getElementById('gauge');
const ctx = canvas.getContext('2d');
const cx = canvas.width/2;
const cy = canvas.height;
const radius = 200;

// 可直接修改儀表數值
let targetValue = 75; // 0~100
const maxValue = 100;

let currentValue = 0;

// 畫半圓背景
function drawBackground() {
    ctx.clearRect(0,0,canvas.width,canvas.height);

    // 外圓光暈
    const gradient = ctx.createRadialGradient(cx,cy,radius*0.2,cx,cy,radius);
    gradient.addColorStop(0,'rgba(255,0,255,0.2)');
    gradient.addColorStop(1,'rgba(0,255,255,0.4)');
    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(cx,cy,radius,Math.PI,0,false);
    ctx.fill();

    // 半圓底色
    ctx.fillStyle = '#0a0a1f';
    ctx.beginPath();
    ctx.arc(cx,cy,radius*0.95,Math.PI,0,false);
    ctx.fill();

    // 刻度
    ctx.save();
    ctx.translate(cx,cy);
    for(let i=0;i<=10;i++){
        const angle = Math.PI + i*(Math.PI/10);
        const x1 = Math.cos(angle)*(radius*0.8);
        const y1 = Math.sin(angle)*(radius*0.8);
        const x2 = Math.cos(angle)*(radius*0.9);
        const y2 = Math.sin(angle)*(radius*0.9);

        // 漸層刻度色彩
        const r = Math.floor(255*(i/10));
        const g = 255-Math.floor(255*(i/10));
        const b = 255*Math.abs(0.5-Math.abs(i/10-0.5))*2;
        ctx.strokeStyle = `rgb(${r},${g},${b})`;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x1,y1);
        ctx.lineTo(x2,y2);
        ctx.stroke();
    }
    ctx.restore();
}

// 畫光暈弧
function drawGlowingArc(value){
    const percent = Math.min(Math.max(value,0),maxValue)/maxValue;
    const angle = Math.PI + percent*Math.PI;

    const gradient = ctx.createLinearGradient(cx-radius,cy,cx+radius,cy);
    gradient.addColorStop(0,'#ff00ff');
    gradient.addColorStop(0.5,'#00ffff');
    gradient.addColorStop(1,'#ffff00');
    ctx.strokeStyle = gradient;
    ctx.lineWidth = 15;
    ctx.beginPath();
    ctx.arc(cx,cy,radius*0.85,Math.PI,angle,false);
    ctx.stroke();
}

// 畫指針
function drawNeedle(value){
    const percent = Math.min(Math.max(value,0),maxValue)/maxValue;
    const angle = Math.PI + percent*Math.PI;

    // 指針
    ctx.strokeStyle = 'red';
    ctx.lineWidth = 6;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.lineTo(cx+Math.cos(angle)*radius*0.75,cy+Math.sin(angle)*radius*0.75);
    ctx.stroke();

    // 中心圓
    ctx.fillStyle = 'red';
    ctx.beginPath();
    ctx.arc(cx,cy,10,0,2*Math.PI);
    ctx.fill();

    // 顯示數值
    ctx.fillStyle = '#0ff';
    ctx.font = '28px Arial';
    ctx.textAlign = 'center';
    ctx.fillText('值: '+Math.round(value),cx,cy-radius*0.2);
}

// 主動畫
function animate(){
    drawBackground();
    currentValue += (targetValue - currentValue)*0.05;
    drawGlowingArc(currentValue);
    drawNeedle(currentValue);
    requestAnimationFrame(animate);
}

// 開始動畫
animate();

// 範例：每 2 秒隨機更新儀表值
setInterval(()=>{
    targetValue = Math.floor(Math.random()*101);
},2000);
</script>
</body>
</html>
