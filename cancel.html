<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>來客數與取消率分析</title>

<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

<style>
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    /* 自訂背景圖片 */
    background: url('images/angry.png') no-repeat center center fixed;
    background-size: cover;
    color:white;
    overflow-x:hidden;
}

/* 上一頁按鈕 */
.back-btn{
    position:fixed;
    top:20px;
    left:20px;
    padding:10px 20px;
    background:#14c8d4;
    border:none;
    border-radius:8px;
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
    z-index:999;
}
.back-btn:hover{
    background:#0aa5af;
    transform:translateY(-2px);
}

/* 圖表容器 */
.chart-container{
    width:1000px;
    height:500px;
    margin:100px auto 50px auto;
    background: rgba(0,0,0,0.6);
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 0 30px rgba(0,255,255,0.4);
}
</style>
</head>

<body>

<button class="back-btn" onclick="goBack()">← 上一頁</button>

<div id="chart3" class="chart-container"></div>
<div id="chart2" class="chart-container"></div>
<div id="chart4" class="chart-container"></div>

<script>
function goBack(){
    if(document.referrer !== ""){
        window.history.back();
    }else{
        window.location.href="index.html";
    }
}

/* ======================
   1️⃣ 每月訂單柱狀圖
====================== */
let months = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
let monthlyVisitors = [5874,8012,9739,11045,11779,10927,12628,13852,10467,11095,6752,6728];

let chart3 = echarts.init(document.getElementById('chart3'));
chart3.setOption({
    title:{ text:'每月訂單數分析', left:'center', textStyle:{ color:'#fff', fontSize:24 } },
    tooltip:{ trigger:'axis' },
    xAxis:{ data:months, axisLabel:{ color:'#fff', rotate:45 } },
    yAxis:{ type:'value', name:'訂單', axisLabel:{ color:'#fff' }, splitLine:{ show:false } },
    series:[{
        type:'bar',
        data:monthlyVisitors,
        barWidth:30,
        itemStyle:{
            borderRadius:10,
            color:new echarts.graphic.LinearGradient(0,0,0,1,
                [{offset:0,color:'#00c3ff'}, {offset:0.5,color:'#ffff1c'}, {offset:1,color:'#00c3ff'}])
        },
        animationDuration:1000
    }]
});

/* 柱狀呼吸動畫 */
let offset3=0;
setInterval(()=>{
    offset3+=0.1;
    chart3.setOption({
        series:[{
            itemStyle:{
                color:new echarts.graphic.LinearGradient(0,0,0,1,
                    [{offset:0,color:'#00c3ff'}, {offset:(Math.sin(offset3)+1)/2,color:'#ffff1c'}, {offset:1,color:'#00c3ff'}])
            }
        }]
    });
},200);

/* ======================
   2️⃣ 取消率雷達圖
====================== */
let radarLabels = ['企業客戶','直接訂房','團體訂房','其他','實體旅行社','旅行社'];
let radarData = [18.91,15.50,61.20,14.77,34.52,36.92];
let chart2 = echarts.init(document.getElementById('chart2'));
chart2.setOption({
    title:{ text:'取消率雷達圖分析', left:'center', textStyle:{ color:'#fff', fontSize:24 } },
    radar:{
        indicator: radarLabels.map(l=>({name:l,max:100})),
        radius:'65%',
        splitLine:{ lineStyle:{ color:'rgba(255,255,255,0.3)' } },
        axisLine:{ lineStyle:{ color:'#fff' } }
    },
    series:[{
        type:'radar',
        data:[{
            value:radarData,
            areaStyle:{ color:'rgba(255,127,80,0.6)' },
            lineStyle:{ width:3 },
            itemStyle:{ color:'#ff7f50' }
        }]
    }]
});

/* ======================
   3️⃣ 房價 × 市場細分象限圖
====================== */
let priceGroup = ['低房價','中房價','高房價'];
let marketSegment = ['線上旅行社','實體旅行社','團體客','直接訂房','企業客戶'];

// 依總數比例分配
let quadrantData = [
    [0,0,45000],[0,1,20000],[0,2,15000],[0,3,9000],[0,4,3534],
    [1,0,8000],[1,1,3500],[1,2,2500],[1,3,1400],[1,4,419],
    [2,0,2946],[2,1,1236],[2,2,1925],[2,3,718],[2,4,1324]
];

let chart4 = echarts.init(document.getElementById('chart4'));
chart4.setOption({
    title:{ text:'房價 × 市場細分 象限分析', left:'center', textStyle:{ color:'#fff', fontSize:24 } },
    tooltip:{
        formatter:function(p){
            return priceGroup[p.value[0]]+"<br>"+
                   marketSegment[p.value[1]]+"<br>訂單數: "+p.value[2];
        }
    },
    xAxis:{ type:'category', data:priceGroup, axisLabel:{ color:'#fff', fontSize:16 } },
    yAxis:{ type:'category', data:marketSegment, axisLabel:{ color:'#fff', fontSize:16 } },
    visualMap: {
        min:0,
        max:45000,
        calculable:true,
        inRange:{ color:['#00ffff','#ffff00','#ff0000'] },
        textStyle:{ color:'#fff' },
        right: 20,       // ← 放右側
        top: 'center',   // 垂直置中
        orient: 'vertical' // 垂直排列
    },
    series:[{
        type:'scatter',
        data:quadrantData,
        symbolSize:function(val){ return val[2]/700; },
        itemStyle:{ shadowBlur:25, shadowColor:'#00ffff', color:'#00ffff' },
        animationDuration:1500,
        animationEasing:'elasticOut'
    }]
});

/* 象限動畫 */
let glow=0;
setInterval(()=>{
    glow+=0.05;
    chart4.setOption({ series:[{ itemStyle:{ shadowBlur:25 + Math.abs(Math.sin(glow))*20 } }] });
},200);

/* ======================
   響應式
====================== */
window.addEventListener('resize', function(){
    chart3.resize();
    chart2.resize();
    chart4.resize();
});
</script>
</body>
</html>
