<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>輸入表單</title>

<style>

/* 背景 */
body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;

    background:url('images/input.png') no-repeat center center fixed;
    background-size:cover;
}

/* 滑鼠粒子背景 */
#mouseEffect{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    z-index:0;
}

/* 表單容器 */
.container{

    position:relative;
    z-index:1;

    background:rgba(0,0,0,0.5);
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 25px rgba(0,0,0,0.7);
    width:350px;
    animation:fadeIn 1s ease-out;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-20px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h2{
    text-align:center;
    margin-bottom:20px;
    font-size:28px;
    text-shadow:0 0 10px #0ff;
}

label{
    display:block;
    margin:10px 0 5px;
    font-weight:bold;
}

input[type="text"], select{

    width:100%;
    padding:8px;
    border-radius:5px;
    border:2px solid transparent;
    margin-bottom:10px;
    transition:all 0.3s ease;

    background-color:rgba(255,255,255,0.1);
    color:#fff;
}

select option{
    color:black;
}

input[type="text"]:focus,
select:focus{

    border-color:#4caf50;
    box-shadow:0 0 10px #4caf50;
    background-color:rgba(255,255,255,0.2);
}

.buttons{

    display:flex;
    justify-content:space-between;
    margin-top:20px;
}

button{

    padding:10px 20px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
    transition:all 0.3s ease;
    font-size:16px;
}

.back-btn{
    background-color:#ff4c4c;
    color:white;
    box-shadow:0 0 8px #ff4c4c;
}

.submit-btn{
    background-color:#4caf50;
    color:white;
    box-shadow:0 0 8px #4caf50;
}

button:hover{
    opacity:0.9;
    transform:scale(1.05);
}

</style>
</head>


<body>

<!-- 滑鼠粒子 -->
<canvas id="mouseEffect"></canvas>

<div class="container">

<h2>輸入表單</h2>

<form id="inputForm">

<label>抵達月份</label>
<select id="field1" name="field1">
<option value="">請選擇月份</option>
<option value="1">1月</option>
<option value="2">2月</option>
<option value="3">3月</option>
<option value="4">4月</option>
<option value="5">5月</option>
<option value="6">6月</option>
<option value="7">7月</option>
<option value="8">8月</option>
<option value="9">9月</option>
<option value="10">10月</option>
<option value="11">11月</option>
<option value="12">12月</option>
</select>


<label>抵達星期</label>
<select id="field2" name="field2">
<option value="">請選擇星期</option>
<option value="1">星期一</option>
<option value="2">星期二</option>
<option value="3">星期三</option>
<option value="4">星期四</option>
<option value="5">星期五</option>
<option value="6">星期六</option>
<option value="7">星期日</option>
</select>


<label>地區</label>
<select id="field3" name="field3">
<option value="">請選擇地區</option>
<option value="1">PRT</option>
<option value="2">OTHER</option>
<option value="3">GBR</option>
<option value="4">FRA</option>
<option value="5">ESP</option>
<option value="6">DEU</option>
<option value="7">ITA</option>
<option value="8">IRL</option>
<option value="9">BEL</option>
<option value="10">BRA</option>
<option value="11">NLD</option>
<option value="12">USA</option>
</select>


<label>市場細分</label>
<select id="field4" name="field4">
<option value="">請選擇市場</option>
<option value="1">線上旅行社</option>
<option value="2">實體旅行社</option>
<option value="3">團體客</option>
<option value="4">直接訂房</option>
<option value="5">企業客戶</option>
<option value="6">其他</option>
</select>


<label>押金類型</label>
<select id="field5" name="field5">
<option value="">押金類型</option>
<option value="1">沒有押金</option>
<option value="2">可退押金</option>
<option value="3">不可退押金</option>
</select>


<label>特殊要求</label>
<select id="field6" name="field6">
<option value="">特殊要求</option>
<option value="1">有需求</option>
<option value="2">沒需求</option>
</select>


<div class="buttons">
<button type="button" class="back-btn" onclick="history.back()">回上頁</button>
<button type="button" class="submit-btn" onclick="submitForm()">輸出</button>
</div>

</form>
</div>


<script>

/* 表單資料 */
function submitForm(){

const form=document.getElementById('inputForm');

const data={};

for(let i=1;i<=6;i++){
data['field'+i]=form['field'+i].value || '';
}

console.log("輸入資料:",data);

window.location.href='output2.html';

}


/* 滑鼠粒子效果 */

const canvas=document.getElementById("mouseEffect");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

window.addEventListener("resize",()=>{

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

});


document.addEventListener("mousemove",(e)=>{

for(let i=0;i<3;i++){

particles.push({
x:e.clientX,
y:e.clientY,
size:Math.random()*6+2,
life:50
});

}

});


function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=0;i<particles.length;i++){

let p=particles[i];

ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);

ctx.fillStyle="rgba(0,255,255,0.8)";
ctx.shadowBlur=20;
ctx.shadowColor="#00ffff";

ctx.fill();

p.size*=0.96;
p.life--;

if(p.life<=0){
particles.splice(i,1);
i--;
}

}

requestAnimationFrame(animate);

}

animate();

</script>

</body>
</html>
