<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>Multiple Radar - ECharts</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
    }

    /* 返回按鈕樣式 */
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 20px;
      background: #1976d2;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
      transition: 0.3s;
    }

    .back-btn:hover {
      background: #125aa0;
      transform: translateY(-2px);
    }

    #main {
      width: 1000px;
      height: 600px;
      margin: 80px auto;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
  </style>
</head>

<body>

<!-- 返回按鈕 -->
<button class="back-btn" onclick="goBack()">← 返回上一頁</button>

<!-- 圖表 -->
<div id="main"></div>

<script>

  // 返回上一頁功能
  function goBack() {
    if (document.referrer !== "") {
      window.history.back();
    } else {
      window.location.href = "index.html"; // 若沒有上一頁則回首頁
    }
  }

  var chartDom = document.getElementById('main');
  var myChart = echarts.init(chartDom);

  var option = {
    title: {
      text: 'Multiple Radar',
      left: 'center'
    },
    tooltip: {
      trigger: 'axis'
    },
    legend: {
      left: 'center',
      top: '30px',
      data: [
        'A Software',
        'A Phone',
        'Another Phone',
        'Precipitation',
        'Evaporation'
      ]
    },
    radar: [
      {
        indicator: [
          { text: 'Brand', max: 100 },
          { text: 'Content', max: 100 },
          { text: 'Usability', max: 100 },
          { text: 'Function', max: 100 }
        ],
        center: ['25%', '55%'],
        radius: 80
      },
      {
        indicator: [
          { text: 'Look', max: 100 },
          { text: 'Photo', max: 100 },
          { text: 'System', max: 100 },
          { text: 'Performance', max: 100 },
          { text: 'Screen', max: 100 }
        ],
        center: ['50%', '55%'],
        radius: 80
      },
      {
        indicator: (function () {
          var res = [];
          for (var i = 1; i <= 12; i++) {
            res.push({ text: i + '月', max: 100 });
          }
          return res;
        })(),
        center: ['75%', '55%'],
        radius: 80
      }
    ],
    series: [
      {
        type: 'radar',
        tooltip: { trigger: 'item' },
        areaStyle: {},
        data: [
          {
            value: [60, 73, 85, 40],
            name: 'A Software'
          }
        ]
      },
      {
        type: 'radar',
        radarIndex: 1,
        areaStyle: {},
        data: [
          {
            value: [85, 90, 90, 95, 95],
            name: 'A Phone'
          },
          {
            value: [95, 80, 95, 90, 93],
            name: 'Another Phone'
          }
        ]
      },
      {
        type: 'radar',
        radarIndex: 2,
        areaStyle: {},
        data: [
          {
            name: 'Precipitation',
            value: [2.6, 5.9, 9.0, 26.4, 28.7, 70.7, 75.6, 82.2, 48.7, 18.8, 6.0, 2.3]
          },
          {
            name: 'Evaporation',
            value: [2.0, 4.9, 7.0, 23.2, 25.6, 76.7, 35.6, 62.2, 32.6, 20.0, 6.4, 3.3]
          }
        ]
      }
    ]
  };

  myChart.setOption(option);

  // 響應式縮放
  window.addEventListener('resize', function() {
    myChart.resize();
  });

</script>

</body>
</html>
